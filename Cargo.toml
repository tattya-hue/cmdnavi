[package]
name = "cmdnavi"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Manage a personal command reference"
license = "Apache-2.0"
repository = "https://github.com/tattya-hue/cmdnavi"
homepage = "https://github.com/tattya-hue/cmdnavi"
readme = "README.md"
keywords = ["cli", "command", "reference", "yaml"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
shell-words = "1"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
