[package]
name = "cmdnavi"
version = "1.3.0"
edition = "2024"
rust-version = "1.89"
description = "Manage a personal command reference"
license = "Apache-2.0"
repository = "https://github.com/tattya-hue/cmdnavi"
homepage = "https://github.com/tattya-hue/cmdnavi"
readme = "README.md"
keywords = ["cli", "command", "reference", "yaml"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29"
rustyline = { version = "18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
